<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Sentinel Forge — Jassim3nidad systems command deck</title>
  <desc id="heroDesc">Jassim3nidad. Systems builder across AI, software, and security. Role: Computer Science student. Mode: building. Status: online. Current system: Venora. Build PROFILE.V1.</desc>
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#16212C" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56C8D8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#56C8D8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, 'Cascadia Mono', 'Segoe UI Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .sweep { transform-origin: 848px 138px; animation: rot 9s linear infinite; }
    .pulse { animation: blink 2.4s ease-in-out infinite; }
    .pulse2 { animation: blink 3.6s ease-in-out infinite; }
    .scanline { animation: scan 11s ease-in-out infinite alternate; }
    @keyframes rot { to { transform: rotate(360deg); } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
    @keyframes scan { from { transform: translateY(0); } to { transform: translateY(226px); } }
    @media (prefers-reduced-motion: reduce) {
      .sweep, .pulse, .pulse2, .scanline { animation: none; }
      .scanline { opacity: 0; }
    }
  </style>

  <!-- deck background -->
  <rect x="1" y="1" width="998" height="298" rx="8" fill="#0B0F14" stroke="#1E2C38" stroke-width="1.5"/>
  <rect x="1" y="1" width="998" height="298" rx="8" fill="url(#grid)"/>

  <!-- drifting scanline -->
  <rect class="scanline" x="4" y="34" width="992" height="2" fill="#56C8D8" opacity="0.06"/>

  <!-- corner brackets -->
  <path d="M 14 26 V 14 H 26" fill="none" stroke="#56C8D8" stroke-width="1.5"/>
  <path d="M 974 14 H 986 V 26" fill="none" stroke="#56C8D8" stroke-width="1.5"/>
  <path d="M 986 274 V 286 H 974" fill="none" stroke="#56C8D8" stroke-width="1.5"/>
  <path d="M 26 286 H 14 V 274" fill="none" stroke="#56C8D8" stroke-width="1.5"/>

  <!-- header row -->
  <text x="48" y="38" class="mono" font-size="13" letter-spacing="2" fill="#56C8D8">&#9698; SENTINEL FORGE</text>
  <text x="218" y="38" class="mono" font-size="13" letter-spacing="2" fill="#5A6873">// SYSTEMS COMMAND DECK</text>
  <text x="952" y="38" text-anchor="end" class="mono" font-size="13" letter-spacing="2" fill="#5A6873">BUILD: PROFILE.V1</text>
  <line x1="48" y1="52" x2="952" y2="52" stroke="#1C2A35" stroke-width="1"/>
  <line x1="48" y1="52" x2="170" y2="52" stroke="url(#fadeR)" stroke-width="1.5"/>

  <!-- left tick ruler -->
  <g stroke="#2A3944" stroke-width="1">
    <line x1="30" y1="70" x2="36" y2="70"/>
    <line x1="30" y1="100" x2="36" y2="100"/>
    <line x1="30" y1="130" x2="36" y2="130"/>
    <line x1="30" y1="160" x2="36" y2="160"/>
    <line x1="30" y1="190" x2="36" y2="190"/>
    <line x1="30" y1="220" x2="36" y2="220"/>
  </g>

  <!-- identification block -->
  <text x="48" y="98" class="mono" font-size="13" letter-spacing="3" fill="#5A6873">SYSTEM IDENTIFICATION</text>
  <text x="46" y="150" class="mono" font-size="54" font-weight="700" letter-spacing="5" fill="#E6EDF3">JASSIM<tspan fill="#56C8D8">3</tspan>NIDAD</text>
  <text x="48" y="185" class="mono" font-size="16" letter-spacing="3" fill="#56C8D8">SYSTEMS BUILDER // AI &#183; SOFTWARE &#183; SECURITY</text>
  <text x="48" y="214" class="sans" font-size="15" fill="#8B98A5">Building software that turns messy real-world workflows into reliable systems.</text>

  <!-- radar module -->
  <g>
    <circle cx="848" cy="138" r="70" fill="none" stroke="#1E2C38" stroke-width="1"/>
    <circle cx="848" cy="138" r="46" fill="none" stroke="#1E2C38" stroke-width="1"/>
    <circle cx="848" cy="138" r="22" fill="none" stroke="#243441" stroke-width="1"/>
    <line x1="778" y1="138" x2="918" y2="138" stroke="#1A2733" stroke-width="1"/>
    <line x1="848" y1="68" x2="848" y2="208" stroke="#1A2733" stroke-width="1"/>
    <g class="sweep">
      <line x1="848" y1="138" x2="848" y2="70" stroke="#56C8D8" stroke-width="1.5" opacity="0.8"/>
      <line x1="848" y1="138" x2="874" y2="76" stroke="#56C8D8" stroke-width="1" opacity="0.25"/>
      <line x1="848" y1="138" x2="890" y2="86" stroke="#56C8D8" stroke-width="1" opacity="0.1"/>
    </g>
    <circle class="pulse" cx="878" cy="112" r="3" fill="#56C8D8"/>
    <circle class="pulse2" cx="818" cy="166" r="3" fill="#E8A33D"/>
    <circle class="pulse2" cx="872" cy="176" r="2" fill="#C678DD"/>
    <circle cx="848" cy="138" r="2" fill="#56C8D8"/>
    <text x="848" y="232" text-anchor="middle" class="mono" font-size="12" letter-spacing="2" fill="#5A6873">SCAN ACTIVE &#183; SECTOR PH-CAV</text>
  </g>

  <!-- status strip -->
  <rect x="48" y="240" width="904" height="36" rx="4" fill="#0E141B" stroke="#1C2A35" stroke-width="1"/>
  <text x="66" y="263" class="mono" font-size="13" fill="#5A6873">ROLE: <tspan fill="#E6EDF3">CS STUDENT</tspan></text>
  <line x1="222" y1="248" x2="222" y2="268" stroke="#1C2A35" stroke-width="1"/>
  <text x="238" y="263" class="mono" font-size="13" fill="#5A6873">MODE: <tspan fill="#E8A33D">BUILDING</tspan></text>
  <line x1="376" y1="248" x2="376" y2="268" stroke="#1C2A35" stroke-width="1"/>
  <text x="392" y="263" class="mono" font-size="13" fill="#5A6873">DOMAIN: <tspan fill="#E6EDF3">FULL-STACK &#183; AI &#183; SECURITY</tspan></text>
  <line x1="668" y1="248" x2="668" y2="268" stroke="#1C2A35" stroke-width="1"/>
  <text x="684" y="263" class="mono" font-size="13" fill="#5A6873">STATUS:</text>
  <circle class="pulse" cx="754" cy="258.5" r="3.5" fill="#56D364"/>
  <text x="763" y="263" class="mono" font-size="13" fill="#56D364">ONLINE</text>
  <line x1="836" y1="248" x2="836" y2="268" stroke="#1C2A35" stroke-width="1"/>
  <text x="850" y="263" class="mono" font-size="13" fill="#5A6873">SYS: <tspan fill="#56C8D8">VENORA</tspan></text>
</svg>
